<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Task Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            color: white;
            padding: 30px 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .sidebar button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            margin-bottom: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .sidebar button:hover {
            background: white;
            color: #764ba2;
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-weight: 600;
        }

        /* Task Form */
        .task-form {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            color: white;
        }

        .task-form input, .task-form select {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
        }

        .task-form button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: white;
            color: #764ba2;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .task-form button:hover {
            background: #f1f1f1;
        }

        /* Task Cards */
        .task-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .task-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 15px;
            color: white;
            transition: 0.3s;
        }

        .task-card:hover {
            transform: translateY(-5px);
        }

        .task-card h3 {
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
        }

        .pending {
            background: orange;
        }

        .progress {
            background: dodgerblue;
        }

        .completed {
            background: green;
        }

        .task-card button {
            margin-top: 10px;
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: white;
            color: #764ba2;
            font-size: 12px;
        }

    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>TaskPro</h2>
        <button>Create Task</button>
        <button>Dashboard</button>
        <button>Analytics</button>
        <button onclick="logout()">Logout</button>
    </div>

    <!-- Main Content -->
    <div class="main">

        <div class="header">
            <h1>Welcome, User 👋</h1>
            <span id="date"></span>
        </div>

        <!-- Task Creation Form -->
        <div class="task-form">
            <h2>Create New Task</h2>
            <input type="text" id="taskTitle" placeholder="Task Title">
            <input type="text" id="assignedTo" placeholder="Assign To">
            <input type="date" id="deadline">
            <select id="status">
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>
            <button onclick="addTask()">Add Task</button>
        </div>

        <!-- Task List -->
        <div class="task-list" id="taskList">

            <!-- Sample Task Card -->
            <div class="task-card">
                <h3>Design Homepage</h3>
                <p><strong>Assigned:</strong> Jessie</p>
                <p><strong>Deadline:</strong> 2026-03-05</p>
                <span class="status pending">Pending</span>
                <br>
                <button>Update</button>
                <button>Delete</button>
            </div>

        </div>

    </div>

<script>
    // Show today's date
    document.getElementById("date").innerText =
        new Date().toDateString();

    function addTask() {
        alert("Connect this button with Firebase logic 🚀");
    }

    function logout() {
        alert("Logout function here");
    }
</script>

</body>
</html>
