<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TaskPro | Modern Task Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            background: radial-gradient(circle at top left, #1e1b4b, #312e81, #0f172a);
            color: var(--text-main);
            overflow: hidden;
        }

        /* --- AUTH OVERLAY --- */
        #auth-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .auth-card {
            background: var(--glass);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .auth-card h2 { margin-bottom: 20px; font-weight: 700; }

        input, select {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.1); }

        .btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn-primary:hover { transform: translateY(-2px); opacity: 0.9; }
        
        .btn-ghost {
            background: transparent;
            color: #cbd5e1;
            font-size: 14px;
            margin-top: 10px;
            cursor: pointer;
            border: none;
        }

        /* --- DASHBOARD LAYOUT --- */
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.03);
            border-right: 1px solid var(--glass-border);
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 { font-size: 24px; margin-bottom: 40px; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .nav-item {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            color: #94a3b8;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--glass);
            color: white;
        }

        .main {
            flex: 1;
            padding: 40px 60px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header h1 { font-size: 32px; font-weight: 700; }
        #date { color: #94a3b8; font-size: 14px; }

        /* --- TASK SECTION --- */
        .section-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 30px;
        }

        .task-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .task-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 20px;
            transition: 0.3s;
        }

        .task-card:hover {
            background: rgba(255, 255, 255, 0.07);
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .status-pill {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 15px;
        }

        .pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .progress { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .completed { background: rgba(16, 185, 129, 0.2); color: #34d399; }

        .card-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn-small {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: transparent;
            color: white;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-small:hover { background: white; color: black; }

        .hidden { display: none !important; opacity: 0; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>Welcome to TaskPro</h2>
            <p style="color: #94a3b8; margin-bottom: 25px;">Please login to continue</p>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            <button class="btn-primary" onclick="loginUser()">Login</button>
            <button class="btn-ghost" onclick="registerUser()">Don't have an account? Register</button>
        </div>
    </div>

    <div class="sidebar">
        <h2>TaskPro.</h2>
        <div class="nav-item active">Dashboard</div>
        <div class="nav-item">Team Tasks</div>
        <div class="nav-item">Analytics</div>
        <div class="nav-item">Settings</div>
        <div style="margin-top: auto;" class="nav-item" onclick="logout()">Logout</div>
    </div>

    <div class="main">
        <div class="header">
            <div>
                <h1>Hello, Designer 👋</h1>
                <span id="date"></span>
            </div>
            <button class="btn-primary" style="width: auto; padding: 12px 24px;" onclick="toggleTaskForm()">+ New Task</button>
        </div>

        <div id="task-form-container" class="section-card hidden">
            <h3 style="margin-bottom: 20px;">Create New Task</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <input type="text" id="taskTitle" placeholder="Task Title">
                <input type="text" id="assignedTo" placeholder="Assign To">
                <input type="date" id="deadline">
                <select id="status">
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>
            <button class="btn-primary" onclick="addTask()">Save Task</button>
        </div>

        <div class="task-grid" id="taskList">
            <div class="task-card">
                <h3 style="font-size: 18px;">Design Mobile App</h3>
                <p style="color: #94a3b8; font-size: 14px; margin-top: 5px;">Assigned to <strong>Jessie</strong></p>
                <p style="color: #94a3b8; font-size: 14px;">Due: Mar 15, 2026</p>
                <span class="status-pill pending">Pending</span>
                <div class="card-actions">
                    <button class="btn-small">Update</button>
                    <button class="btn-small" style="border-color: #ef4444; color: #f87171;">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set Date
        document.getElementById("date").innerText = new Date().toLocaleDateString('en-US', { 
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
        });

        // UI Toggles
        function toggleTaskForm() {
            const form = document.getElementById('task-form-container');
            form.classList.toggle('hidden');
        }

        // Mock Auth Logic
        function loginUser() {
            const email = document.getElementById('email').value;
            if(email) {
                document.getElementById('auth-overlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('auth-overlay').style.display = 'none';
                }, 500);
            } else {
                alert("Please enter an email");
            }
        }

        function addTask() {
            alert("Ready for Firebase integration! 🚀");
            toggleTaskForm();
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
